aid: peaxy
name: Peaxy
description: >-
  Peaxy, Inc. is a San Jose, California industrial AI and digital-twin software company founded in
  2012, with offices in Stockholm, Sweden and Cagliari, Italy. Its Peaxy Lifecycle Intelligence (PLI)
  platform threads design, test, manufacturing, field and service data for mission-critical physical
  assets into a single cloud-based source of truth, then applies machine learning to predict failures,
  extend asset life and support warranty, quality and readiness decisions. Product lines cover battery
  and energy-storage analytics (R&D through manufacturing, deployment and second life), defense
  readiness and predictive maintenance for the U.S. Department of Defense and Department of Energy,
  critical infrastructure and airport/circuit-level AI, a battery LIMS, and EcoGrid for renewable
  energy communities. Peaxy markets "a range of open APIs" for platform integration, but publishes no
  public developer portal, API reference or machine-readable contract — access runs through a demo
  request and a customer engagement. The platform is SOC 2 Type II certified and aligned to NIST
  800-171.
